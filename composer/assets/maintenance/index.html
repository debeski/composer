<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporarily unavailable</title>
  <link rel="stylesheet" href="/_dlux/maintenance/maintenance.css">
  <script src="/_dlux/maintenance/maintenance.js" defer></script>
</head>
<body>
  <main>
    <h1 id="heading">This site is temporarily unavailable</h1>
    <p id="summary">The application is restarting or under maintenance. This page returns to the site as soon as it is back.</p>
    <div class="meta" id="meta" hidden>
      <span class="pill" id="phase">Preparing</span>
      <span class="pill muted" id="updated">Waiting for status...</span>
    </div>
    <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="12" hidden>
      <div class="bar" id="bar"></div>
    </div>
    <div class="status" id="statusText" hidden></div>
    <pre id="log" class="muted" hidden>Waiting for deployment log...</pre>
  </main>
</body>
</html>
