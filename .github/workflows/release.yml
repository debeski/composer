name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag -a v1.0.0 -m "v1.0.0" && git push origin v1.0.0
#
# Pipeline:
#   classify       -> parse the tag; decide channel/aliases once, for every job
#   build-push     -> multi-arch (amd64+arm64) build, push debeski/composer:<ver>
#                     plus the moving alias the tag is entitled to
#   github-release -> create the GitHub Release from the matching CHANGELOG section
#
# The tag chooses the channel. `v1.4.0b1` pushes :v1.4.0b1 and :beta and marks
# the GitHub release a prerelease that is NOT "latest"; `v1.4.0` pushes :v1.4.0
# and :latest, and additionally takes :beta only when nothing newer is already
# there — a beta deployment should receive finals, but :beta must never move
# backwards onto an older stable than the beta it is already running.
#
# One-time setup (see docs/RELEASING.md): add repo secrets
#   DOCKERHUB_USERNAME  - Docker Hub account/namespace (debeski)
#   DOCKERHUB_TOKEN     - Docker Hub access token with read/write to debeski/composer

on:
  push:
    tags: ["v*"]

env:
  IMAGE: debeski/composer

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      channel: ${{ steps.tag.outputs.channel }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      make_latest: ${{ steps.tag.outputs.make_latest }}
      advance_beta: ${{ steps.tag.outputs.advance_beta }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the version parser
        run: python -m pip install "packaging>=23.2"

      # What :beta points at now decides whether a stable release may take that
      # alias. Existence and version are read separately because they want
      # opposite answers when absent: an alias that does not exist is free to
      # claim, one that exists but cannot be read must not be overwritten.
      #
      # The version is indexed by platform. These are multi-arch manifest
      # lists, and on a list `.Image` is nil — the un-indexed form fails with
      # "index of untyped nil", which `|| true` then turns into a silent empty
      # string. That looked exactly like "no beta published".
      - name: Read the current :beta version
        id: beta
        run: |
          if docker buildx imagetools inspect ${{ env.IMAGE }}:beta >/dev/null 2>&1; then
            current="$(docker buildx imagetools inspect ${{ env.IMAGE }}:beta \
              --format '{{ $img := index .Image "linux/amd64" }}{{ index $img.Config.Labels "org.opencontainers.image.version" }}' \
              2>/dev/null | tr -d '[:space:]' || true)"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "current=${current}" >> "$GITHUB_OUTPUT"
            echo ":beta exists and reports '${current:-<unreadable>}'"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "current=" >> "$GITHUB_OUTPUT"
            echo ":beta does not exist yet"
          fi

      - name: Classify and validate the release tag
        id: tag
        run: |
          python -m composer.release_tag --github-output \
            --current-beta "${{ steps.beta.outputs.current }}" \
            --beta-exists "${{ steps.beta.outputs.exists }}"

  build-push:
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install "PyYAML==6.0.3" "packaging>=23.2"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Build the amd64 image locally and run runtime smoke tests BEFORE any
      # push, so a broken image never reaches Docker Hub. The layers are cached
      # and reused by the multi-arch push below.
      - name: Build amd64 image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Runtime smoke tests
        run: ./scripts/smoke-test.sh ${{ env.IMAGE }}:ci-test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The immutable version tag is always pushed. The moving aliases are
      # computed, never hardcoded: a prerelease takes :beta and must not touch
      # :latest, and a stable takes :latest plus :beta when it is newer than
      # whatever :beta already holds.
      - name: Resolve the image tags this release publishes
        id: tags
        run: |
          {
            echo 'list<<EOF'
            echo "${{ env.IMAGE }}:${{ github.ref_name }}"
            if [ "${{ needs.classify.outputs.prerelease }}" = "true" ]; then
              echo "${{ env.IMAGE }}:beta"
            else
              echo "${{ env.IMAGE }}:latest"
              if [ "${{ needs.classify.outputs.advance_beta }}" = "true" ]; then
                echo "${{ env.IMAGE }}:beta"
              fi
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.version=${{ needs.classify.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: [classify, build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Whole-heading match. The awk prefix regex this replaced matched
      # `## v1.3.14b1` for version 1.3.14, so a stable release could ship its
      # own beta's notes and look entirely normal doing it.
      - name: Extract this version's CHANGELOG section
        run: |
          python -m pip install "packaging>=23.2"
          python - "${{ needs.classify.outputs.version }}" <<'PY' > RELEASE_NOTES.md
          import sys
          from composer.release_tag import changelog_section
          notes = changelog_section(sys.argv[1])
          if not notes:
              sys.exit(f"CHANGELOG.md has no '## v{sys.argv[1]}' section.")
          sys.stdout.write(notes + "\n")
          PY
          echo "---- release notes ----"; cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.classify.outputs.prerelease }}
          make_latest: ${{ needs.classify.outputs.make_latest }}
