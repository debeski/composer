name: CI

# Green-checkmark gate on every push/PR to main: byte-compile the package,
# smoke-test the CLI, and verify the Docker image still builds. Releases run
# independently through release.yml on version tags.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: debeski/composer

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tests run the real release_tag CLI, whose beta-first gate reads tags.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install "PyYAML==6.0.3" "packaging>=23.2" "cryptography>=42"

      - name: Byte-compile package
        run: python -m compileall composer

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          python -m composer --version
          python -m composer --help | grep -- '--purge'

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (load for testing)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runtime smoke tests
        run: ./scripts/smoke-test.sh ${{ env.IMAGE }}:ci-test
