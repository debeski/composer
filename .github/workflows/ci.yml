name: CI

# Green-checkmark gate on every push/PR to main: byte-compile the package,
# smoke-test the CLI, and verify the Docker image still builds. Releases run
# independently through release.yml on version tags.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: debeski/composer

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The tests run the real release_tag CLI, whose beta-first gate reads tags.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install "PyYAML==6.0.3" "packaging>=23.2"

      - name: Byte-compile package
        run: python -m compileall composer

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          python -m composer --version
          python -m composer --help | grep -- '--purge'

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image (load for testing)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runtime smoke tests
        run: ./scripts/smoke-test.sh ${{ env.IMAGE }}:ci-test
